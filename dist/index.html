<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071b26" />
  <meta name="description" content="苏雨菲的像素回忆冒险。" />
  <title>花生带你回到那一天</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="game-shell">
    <section id="title-screen" class="overlay-screen active">
      <div class="title-card">
        <p class="eyebrow">A MEMORY ADVENTURE FOR JENNY</p>
        <h1>花生带你<br />回到那一天</h1>
        <p>一卷坏掉的胶片，藏着七段不想忘记的日子。</p>
        <div class="pixel-cast" aria-hidden="true">
          <span class="mini-sprite jenny-mini"></span>
          <span class="heart">♥</span>
          <span class="mini-sprite peanut-mini"></span>
        </div>
        <div class="start-actions">
          <button id="start-button" class="primary">进入放映室</button>
          <button id="continue-button" class="secondary" hidden>继续上次进度</button>
        </div>
        <small>点击地面移动 · 靠近物品后进行互动</small>
      </div>
    </section>

    <section id="play-screen" class="play-screen" aria-label="像素回忆游戏">
      <header class="hud">
        <div>
          <p id="scene-label" class="scene-label">序章 · 放映室</p>
          <p id="objective" class="objective">找到让放映机重新转动的东西</p>
        </div>
        <div class="hud-actions">
          <button id="restart-button" class="text-button">↻ 重新开始</button>
          <button id="sound-button" class="icon-button" aria-label="声音开关">♪</button>
        </div>
      </header>

      <div id="canvas-wrap">
        <canvas id="game-canvas" width="960" height="540" aria-label="游戏场景"></canvas>
        <div id="loading" class="loading">正在把回忆装进放映机…</div>
        <div id="tap-marker" class="tap-marker" aria-hidden="true"></div>
        <button id="action-button" class="action-button" hidden>互动</button>
        <div id="dialogue" class="dialogue" hidden>
          <span id="speaker-avatar" class="speaker-avatar">🐶</span>
          <div><b id="speaker">花生</b><p id="dialogue-text"></p></div>
          <span class="continue-caret">▼</span>
        </div>
      </div>

      <div class="controls-help">
        <span>点击地面 / WASD 移动</span>
        <span id="memory-count">胶片 0 / 7</span>
      </div>
    </section>
  </main>

  <section id="ring-panel" class="modal" hidden aria-label="挑选戒指">
    <div class="modal-card">
      <p class="eyebrow">弘大 · 戒指小摊</p>
      <h2>替他挑一枚戒指</h2>
      <p>没有正确答案。那天重要的不是挑中了哪一枚，而是你认真替他看了很久。</p>
      <div class="ring-options">
        <button data-ring="蓝宝石戒指"><img src="assets/props/ring-blue.png" alt="蓝宝石戒指" /><b>蓝宝石</b><small>像第一次见面时的首尔夜色</small></button>
        <button data-ring="翡翠戒指"><img src="assets/props/ring-green.png" alt="翡翠戒指" /><b>翡翠</b><small>是 Jenny 喜欢的绿色</small></button>
        <button data-ring="钻石戒指"><img src="assets/props/ring-diamond.png" alt="钻石戒指" /><b>钻石</b><small>小小一枚，却很认真</small></button>
      </div>
    </div>
  </section>

  <section id="letter-panel" class="modal" hidden aria-label="第一张回忆胶片">
    <div class="modal-card letter-card">
      <div class="film-icon"><img src="assets/props/film-white.png" alt="回忆胶片" /></div>
      <p id="letter-eyebrow" class="eyebrow">MEMORY 01 RESTORED</p>
      <h2 id="letter-title">镜子里的第一次</h2>
      <p id="letter-copy" class="letter-copy">宝宝，第一次见你时，我已经在镜子里偷偷练习，怎样站在你身边。后来我才知道，那天真正被挑中的不是戒指，是我。</p>
      <button id="return-button" class="primary">把胶片带回放映室</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
